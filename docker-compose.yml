services:
  app:
    pull_policy: build
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_application_credentials.json
      # Docker copies the proxy from ~/.docker/config.json into every container. On this
      # machine that corporate proxy drops or rate-limits connections to most public job
      # sites (robots.txt "could not be read", 429s) although direct egress works, and it
      # would also send the compose-internal storage emulator off-machine. Blank it so the
      # crawler, Vertex AI and the emulator all connect directly. A machine that has no
      # direct egress needs these removed and NO_PROXY set to localhost,127.0.0.1,gcs.
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
    secrets:
      - source: google_adc
        target: google_application_credentials.json
    volumes:
      - ./backend/logs:/var/log/cv-applier
      # - :containerPath:ro
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    command: >-
      sh -c "alembic upgrade head && exec uvicorn app.main:app
      --host 0.0.0.0 --port $${PORT:-8000}
      --proxy-headers --forwarded-allow-ips='*'"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv_applier
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cv -d cv_applier"]
      interval: 2s
      timeout: 5s
      retries: 20

  gcs:
    image: fsouza/fake-gcs-server
    ports:
      - "4443:4443"
    command: ["-scheme", "http", "-external-url", "http://gcs:4443"]

volumes:
  pgdata:

secrets:
  google_adc:
    file: ${HOME}/.config/gcloud/application_default_credentials.json
