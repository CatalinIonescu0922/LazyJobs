version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)s %(name)s: %(message)s"
    datefmt: "%Y-%m-%dT%H:%M:%S%z"

handlers:
  stdout:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: app.log
    maxBytes: 10485760
    backupCount: 3
    encoding: utf8

loggers:
  cv_applier:
    level: INFO
    handlers: [stdout, file]
    propagate: false

root:
  level: WARNING
  handlers: [stdout]